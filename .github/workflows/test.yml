name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: run the suite with nothing installed
        run: python3 tests/test_audit.py
      - name: the auditor runs on its own template
        run: |
          mkdir -p /tmp/t && cp templates/paper-skeleton.tex /tmp/t/main.tex
          python3 scripts/audit_paper.py /tmp/t || true
